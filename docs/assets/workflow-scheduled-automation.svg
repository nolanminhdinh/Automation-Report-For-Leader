<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" width="100%" height="100%" style="background:#1e1e1e; font-family:'Segoe UI', Inter, sans-serif;">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4fc3f7" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ba68c8" />
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ffb74d" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#81c784" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Header Title -->
  <text x="700" y="42" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="bold" letter-spacing="1">LUỒNG HOẠT ĐỘNG TỰ ĐỘNG HÓA THEO LỊCH (SCHEDULED DISPATCHER)</text>
  <text x="700" y="68" text-anchor="middle" fill="#9e9e9e" font-size="13">Quy trình thực thi không người lái qua GitHub Actions Cron &amp; Phân phối đa kênh tức thời tới Mentor và Leader</text>

  <!-- Column 1: Timers & Triggers -->
  <g transform="translate(40, 105)" filter="url(#shadow)">
    <rect width="260" height="470" rx="10" fill="#252526" stroke="#0288d1" stroke-width="1.5"/>
    <rect width="260" height="38" rx="10" fill="#0288d1" opacity="0.25"/>
    <text x="130" y="24" text-anchor="middle" fill="#4fc3f7" font-size="14" font-weight="bold">1. BỘ ĐẾM GIỜ &amp; KÍCH HOẠT</text>

    <!-- Box Cron Schedule -->
    <rect x="15" y="55" width="230" height="205" rx="8" fill="#1e1e1e" stroke="#0288d1" stroke-width="1"/>
    <text x="25" y="78" fill="#4fc3f7" font-size="13" font-weight="bold">⏰ Cron Trigger (Định kỳ)</text>
    <text x="25" y="102" fill="#fff176" font-size="12">Thứ Sáu 17:00 (10:00 UTC)</text>
    <text x="25" y="120" fill="#cccccc" font-size="11">• Tổng kết tuần làm việc</text>
    <text x="25" y="136" fill="#cccccc" font-size="11">• Thống kê tiến độ các batch</text>
    
    <text x="25" y="162" fill="#fff176" font-size="12">Chủ Nhật 20:00 (13:00 UTC)</text>
    <text x="25" y="180" fill="#cccccc" font-size="11">• Chốt số liệu trước phiên Mentor</text>
    <text x="25" y="196" fill="#cccccc" font-size="11">• Soạn thảo bản nháp báo cáo</text>
    
    <text x="25" y="222" fill="#fff176" font-size="12">08:00 Hàng ngày (Tùy chọn)</text>
    <text x="25" y="240" fill="#cccccc" font-size="11">• Daily standup &amp; KPI check</text>

    <!-- Box Manual Dispatch -->
    <rect x="15" y="275" width="230" height="175" rx="8" fill="#1e1e1e" stroke="#0288d1" stroke-width="1"/>
    <text x="25" y="298" fill="#4fc3f7" font-size="13" font-weight="bold">👆 Kích Hoạt Thủ Công</text>
    <text x="25" y="322" fill="#cccccc" font-size="11">• GitHub Workflow Dispatch:</text>
    <text x="25" y="340" fill="#81d4fa" font-size="11">  1-Click trên giao diện web</text>
    <text x="25" y="362" fill="#cccccc" font-size="11">• Tùy chọn truyền tham số:</text>
    <text x="25" y="380" fill="#aaaaaa" font-size="11">  - Task ID cụ thể</text>
    <text x="25" y="396" fill="#aaaaaa" font-size="11">  - Bật/tắt thông báo bot</text>
    <text x="25" y="416" fill="#cccccc" font-size="11">• Lệnh CLI khẩn cấp:</text>
    <text x="25" y="434" fill="#81d4fa" font-size="11">  python src/main.py --task-id X</text>
  </g>

  <!-- Column 2: Cloud Runner -->
  <g transform="translate(360, 105)" filter="url(#shadow)">
    <rect width="320" height="470" rx="10" fill="#252526" stroke="#ab47bc" stroke-width="1.5"/>
    <rect width="320" height="38" rx="10" fill="#ab47bc" opacity="0.25"/>
    <text x="160" y="24" text-anchor="middle" fill="#e1bee7" font-size="14" font-weight="bold">2. CLOUD AUTOMATION RUNNER</text>

    <!-- Box Setup -->
    <rect x="15" y="55" width="290" height="95" rx="8" fill="#1e1e1e" stroke="#ba68c8" stroke-width="1"/>
    <text x="25" y="78" fill="#e1bee7" font-size="13" font-weight="bold">GitHub Ubuntu Runner (Serverless)</text>
    <text x="25" y="100" fill="#cccccc" font-size="11">• Tự động dựng môi trường Python 3.10</text>
    <text x="25" y="118" fill="#cccccc" font-size="11">• Pip cache tăng tốc độ build (&lt;30 giây)</text>
    <text x="25" y="136" fill="#ce93d8" font-size="11">• Chạy hoàn toàn trên Cloud (0đ chi phí)</text>

    <!-- Box Secrets -->
    <rect x="15" y="160" width="290" height="100" rx="8" fill="#1e1e1e" stroke="#ba68c8" stroke-width="1"/>
    <text x="25" y="183" fill="#e1bee7" font-size="13" font-weight="bold">Bảo Mật Secrets Vault</text>
    <text x="25" y="205" fill="#cccccc" font-size="11">• Nạp an toàn: CVAT_HOST, CVAT_TOKEN</text>
    <text x="25" y="223" fill="#cccccc" font-size="11">• Nạp: GITHUB_TOKEN, TELEGRAM_BOT_TOKEN</text>
    <text x="25" y="241" fill="#ce93d8" font-size="11">• Không lộ bất kỳ thông tin mật ra mã nguồn</text>

    <!-- Box Execution -->
    <rect x="15" y="270" width="290" height="180" rx="8" fill="#1e1e1e" stroke="#ba68c8" stroke-width="1"/>
    <text x="25" y="293" fill="#e1bee7" font-size="13" font-weight="bold">Thực Thi Pipeline &amp; Analytics</text>
    <text x="25" y="315" fill="#cccccc" font-size="11">• Kết nối CVAT API lấy Tasks, Jobs, Issues</text>
    <text x="25" y="333" fill="#cccccc" font-size="11">• Quét GitHub Issues (nhãn 'ca-kho', 'blocker')</text>
    <text x="25" y="351" fill="#cccccc" font-size="11">• Gom tiến độ theo Batch, tính Velocity</text>
    <text x="25" y="369" fill="#cccccc" font-size="11">• Tính DQC QA Score, lập ma trận 4 lỗi</text>
    <text x="25" y="387" fill="#cccccc" font-size="11">• Trích xuất Deep Link trỏ thẳng Frame CVAT</text>
    <text x="25" y="405" fill="#cccccc" font-size="11">• Tùy chọn: LLM tổng hợp Executive Summary</text>
    <text x="25" y="427" fill="#ce93d8" font-size="11">👉 Thời gian xử lý: 15 – 35 giây</text>
  </g>

  <!-- Column 3: Artifacts & Commit -->
  <g transform="translate(740, 105)" filter="url(#shadow)">
    <rect width="310" height="470" rx="10" fill="#252526" stroke="#f57c00" stroke-width="1.5"/>
    <rect width="310" height="38" rx="10" fill="#f57c00" opacity="0.25"/>
    <text x="155" y="24" text-anchor="middle" fill="#ffb74d" font-size="14" font-weight="bold">3. ĐỒNG BỘ HIỆN VẬT &amp; GIT</text>

    <!-- Box Datasets -->
    <rect x="15" y="55" width="280" height="120" rx="8" fill="#1e1e1e" stroke="#f57c00" stroke-width="1"/>
    <text x="25" y="78" fill="#ffb74d" font-size="13" font-weight="bold">Cập Nhật Dataset Cho Power BI</text>
    <text x="25" y="100" fill="#cccccc" font-size="11">• data/processed/batch_progress.csv</text>
    <text x="25" y="118" fill="#cccccc" font-size="11">• data/processed/qa_metrics.csv</text>
    <text x="25" y="136" fill="#cccccc" font-size="11">• data/processed/edge_cases.csv</text>
    <text x="25" y="156" fill="#ffe0b2" font-size="11">👉 Sẵn sàng cho Power BI Refresh</text>

    <!-- Box Markdown -->
    <rect x="15" y="185" width="280" height="125" rx="8" fill="#1e1e1e" stroke="#f57c00" stroke-width="1"/>
    <text x="25" y="208" fill="#ffb74d" font-size="13" font-weight="bold">Sinh Bản Báo Cáo Pre-Mentor</text>
    <text x="25" y="230" fill="#cccccc" font-size="11">• reports/MENTOR_REPORT_DRAFT.md</text>
    <text x="25" y="248" fill="#cccccc" font-size="11">• Đủ 4 phần: Tiến độ, QA, Ca khó, Câu hỏi</text>
    <text x="25" y="266" fill="#cccccc" font-size="11">• Tích hợp sẵn Deep Link &amp; Checkbox</text>
    <text x="25" y="288" fill="#ffe0b2" font-size="11">👉 Mentor đọc trước không mất thời gian</text>

    <!-- Box Auto Git Commit -->
    <rect x="15" y="320" width="280" height="130" rx="8" fill="#1e1e1e" stroke="#f57c00" stroke-width="1"/>
    <text x="25" y="343" fill="#ffb74d" font-size="13" font-weight="bold">Tự Động Commit &amp; Push [skip ci]</text>
    <text x="25" y="365" fill="#cccccc" font-size="11">• Bot tự động `git add reports/ data/`</text>
    <text x="25" y="383" fill="#cccccc" font-size="11">• Kiểm tra khác biệt: chỉ commit nếu có data mới</text>
    <text x="25" y="401" fill="#cccccc" font-size="11">• Push an toàn về branch main</text>
    <text x="25" y="423" fill="#ffe0b2" font-size="11">👉 Lưu vết lịch sử minh bạch trên Git</text>
  </g>

  <!-- Column 4: Dispatcher Channels -->
  <g transform="translate(1110, 105)" filter="url(#shadow)">
    <rect width="250" height="470" rx="10" fill="#252526" stroke="#388e3c" stroke-width="1.5"/>
    <rect width="250" height="38" rx="10" fill="#388e3c" opacity="0.25"/>
    <text x="125" y="24" text-anchor="middle" fill="#81c784" font-size="14" font-weight="bold">4. PHÂN PHỐI TỨC THỜI</text>

    <!-- Channel Telegram -->
    <rect x="15" y="55" width="220" height="90" rx="8" fill="#1e1e1e" stroke="#388e3c" stroke-width="1"/>
    <text x="25" y="78" fill="#81c784" font-size="13" font-weight="bold">📱 Telegram Bot Alert</text>
    <text x="25" y="98" fill="#cccccc" font-size="11">• Bắn tin vào Group Chat</text>
    <text x="25" y="116" fill="#cccccc" font-size="11">• Card KPI tóm tắt + nút Link</text>
    <text x="25" y="132" fill="#c8e6c9" font-size="10">👉 Cả nhóm nhận tin tức thì</text>

    <!-- Channel Discord -->
    <rect x="15" y="155" width="220" height="90" rx="8" fill="#1e1e1e" stroke="#388e3c" stroke-width="1"/>
    <text x="25" y="178" fill="#81c784" font-size="13" font-weight="bold">💬 Discord Webhook</text>
    <text x="25" y="198" fill="#cccccc" font-size="11">• Embed card màu sắc</text>
    <text x="25" y="216" fill="#cccccc" font-size="11">• Ping @TeamLead @Mentor</text>
    <text x="25" y="232" fill="#c8e6c9" font-size="10">👉 Không lo trôi tin nhắn</text>

    <!-- Channel Email -->
    <rect x="15" y="255" width="220" height="85" rx="8" fill="#1e1e1e" stroke="#388e3c" stroke-width="1"/>
    <text x="25" y="278" fill="#81c784" font-size="13" font-weight="bold">📧 Email Dispatch</text>
    <text x="25" y="298" fill="#cccccc" font-size="11">• Báo cáo HTML trang trọng</text>
    <text x="25" y="316" fill="#cccccc" font-size="11">• Đính kèm PDF cho Mentor</text>
    <text x="25" y="330" fill="#c8e6c9" font-size="10">👉 Chuẩn mực giao tiếp</text>

    <!-- Leader & Mentor -->
    <rect x="15" y="350" width="220" height="100" rx="8" fill="#1e1e1e" stroke="#fbc02d" stroke-width="1.2"/>
    <text x="25" y="373" fill="#fff176" font-size="13" font-weight="bold">👥 Nhóm Trưởng &amp; Mentor</text>
    <text x="25" y="393" fill="#cccccc" font-size="11">• Leader duyệt trong 5 phút</text>
    <text x="25" y="411" fill="#cccccc" font-size="11">• Mở Power BI Refresh</text>
    <text x="25" y="431" fill="#ffe082" font-size="11">👉 Sẵn sàng cho buổi họp!</text>
  </g>

  <!-- Connectors -->
  <!-- Col 1 to Col 2 -->
  <line x1="300" y1="180" x2="355" y2="180" stroke="#4fc3f7" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="300" y1="350" x2="355" y2="350" stroke="#4fc3f7" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Col 2 to Col 3 -->
  <line x1="680" y1="260" x2="735" y2="260" stroke="#ba68c8" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <line x1="680" y1="360" x2="735" y2="360" stroke="#ba68c8" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <!-- Col 3 to Col 4 -->
  <line x1="1050" y1="200" x2="1105" y2="200" stroke="#ffb74d" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <line x1="1050" y1="380" x2="1105" y2="380" stroke="#ffb74d" stroke-width="2" marker-end="url(#arrow-orange)"/>

  <!-- Bottom Value Proposition -->
  <g transform="translate(40, 605)" filter="url(#shadow)">
    <rect width="1320" height="175" rx="10" fill="#252526" stroke="#0288d1" stroke-width="1.5"/>
    <rect width="1320" height="34" rx="10" fill="#0288d1" opacity="0.25"/>
    <text x="660" y="22" text-anchor="middle" fill="#81d4fa" font-size="14" font-weight="bold">LỢI ÍCH CỦA VIỆC VẬN HÀNH TỰ ĐỘNG HÓA THEO LỊCH (AUTONOMOUS OPERATIONS)</text>

    <g transform="translate(30, 45)">
      <rect width="390" height="110" rx="8" fill="#1e1e1e" stroke="#0288d1" stroke-width="1"/>
      <text x="15" y="26" fill="#4fc3f7" font-size="13" font-weight="bold">☁️ Serverless 100% Không Cần Treo Máy</text>
      <text x="15" y="50" fill="#cccccc" font-size="11">• Chạy hoàn toàn trên máy chủ Cloud miễn phí của GitHub Actions.</text>
      <text x="15" y="70" fill="#cccccc" font-size="11">• Thành viên và nhóm trưởng không cần mở máy tính cá nhân 24/7,</text>
      <text x="15" y="90" fill="#81d4fa" font-size="11">  đúng giờ hẹn hệ thống tự động thức dậy, thực thi và báo cáo.</text>
    </g>

    <g transform="translate(465, 45)">
      <rect width="390" height="110" rx="8" fill="#1e1e1e" stroke="#0288d1" stroke-width="1"/>
      <text x="15" y="26" fill="#4fc3f7" font-size="13" font-weight="bold">⏳ Tiết Kiệm 2 - 4 Giờ Chuẩn Bị Mỗi Tuần</text>
      <text x="15" y="50" fill="#cccccc" font-size="11">• Xóa bỏ việc đếm frame thủ công, tính điểm QA trên Excel rời rạc.</text>
      <text x="15" y="70" fill="#cccccc" font-size="11">• Tự động gom toàn bộ ca khó kèm Deep Link trỏ đúng vị trí lỗi,</text>
      <text x="15" y="90" fill="#81d4fa" font-size="11">  tiết kiệm 90% thời gian tìm kiếm frame trong buổi họp Mentor.</text>
    </g>

    <g transform="translate(900, 45)">
      <rect width="390" height="110" rx="8" fill="#1e1e1e" stroke="#0288d1" stroke-width="1"/>
      <text x="15" y="26" fill="#4fc3f7" font-size="13" font-weight="bold">🎯 Đảm Bảo Tính Kỷ Luật &amp; Nhất Quán</text>
      <text x="15" y="50" fill="#cccccc" font-size="11">• Báo cáo luôn được phát đi đúng hẹn (17h thứ 6 và 20h chủ nhật).</text>
      <text x="15" y="70" fill="#cccccc" font-size="11">• Dữ liệu được lưu vết (audit trail) liên tục trên Git repository,</text>
      <text x="15" y="90" fill="#81d4fa" font-size="11">  tạo nền tảng vững chắc cho quản trị chất lượng dữ liệu AI.</text>
    </g>
  </g>
</svg>
