<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" width="100%" height="100%" style="background:#1e1e1e; font-family:'Segoe UI', Inter, sans-serif;">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4fc3f7" />
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ffb74d" />
    </marker>
    <marker id="arrow-gold" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fbc02d" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#81c784" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Header Title -->
  <text x="700" y="42" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="bold" letter-spacing="1">MÔ HÌNH HYBRID: PYTHON ETL ENGINE &amp; POWER BI ANALYTICS DASHBOARD</text>
  <text x="700" y="68" text-anchor="middle" fill="#9e9e9e" font-size="13">Kiến trúc kết hợp giữa Tự động hóa Pipeline dữ liệu (Python) &amp; Trực quan hóa cấp Doanh nghiệp (Power BI)</text>

  <!-- Column 1: Data Sources -->
  <g transform="translate(40, 105)" filter="url(#shadow)">
    <rect width="250" height="470" rx="10" fill="#252526" stroke="#0288d1" stroke-width="1.5"/>
    <rect width="250" height="38" rx="10" fill="#0288d1" opacity="0.25"/>
    <text x="125" y="24" text-anchor="middle" fill="#4fc3f7" font-size="14" font-weight="bold">1. NGUỒN DỮ LIỆU ĐẦU VÀO</text>

    <!-- Box CVAT -->
    <rect x="15" y="55" width="220" height="185" rx="8" fill="#1e1e1e" stroke="#0288d1" stroke-width="1"/>
    <text x="25" y="80" fill="#4fc3f7" font-size="14" font-weight="bold">CVAT REST API v2</text>
    <text x="25" y="105" fill="#cccccc" font-size="12">• /api/tasks &amp; /api/jobs</text>
    <text x="25" y="125" fill="#aaaaaa" font-size="11">  (Tiến độ, Assignee, Trạng thái)</text>
    <text x="25" y="147" fill="#cccccc" font-size="12">• /api/quality/reports</text>
    <text x="25" y="167" fill="#aaaaaa" font-size="11">  (Điểm QA/QC, Pass/Reject rate)</text>
    <text x="25" y="189" fill="#cccccc" font-size="12">• /api/issues &amp; comments</text>
    <text x="25" y="209" fill="#aaaaaa" font-size="11">  (Ca khó, Bounding box lỗi)</text>
    <text x="25" y="230" fill="#81d4fa" font-size="11">👉 Deep Link trực tiếp đến Frame</text>

    <!-- Box GitHub -->
    <rect x="15" y="255" width="220" height="195" rx="8" fill="#1e1e1e" stroke="#0288d1" stroke-width="1"/>
    <text x="25" y="280" fill="#4fc3f7" font-size="14" font-weight="bold">GitHub REST API v3</text>
    <text x="25" y="305" fill="#cccccc" font-size="12">• Issues &amp; Discussions</text>
    <text x="25" y="325" fill="#aaaaaa" font-size="11">  (Label: 'ca-kho', 'blocker')</text>
    <text x="25" y="347" fill="#cccccc" font-size="12">• Commits &amp; Pull Requests</text>
    <text x="25" y="367" fill="#aaaaaa" font-size="11">  (Theo dõi tiến độ code &amp; tool)</text>
    <text x="25" y="389" fill="#cccccc" font-size="12">• Guideline Changes</text>
    <text x="25" y="409" fill="#aaaaaa" font-size="11">  (Lịch sử sửa đổi quy chuẩn)</text>
    <text x="25" y="432" fill="#81d4fa" font-size="11">👉 Câu hỏi mở gửi Mentor</text>
  </g>

  <!-- Column 2: Python ETL Engine -->
  <g transform="translate(350, 105)" filter="url(#shadow)">
    <rect width="320" height="470" rx="10" fill="#252526" stroke="#f57c00" stroke-width="1.5"/>
    <rect width="320" height="38" rx="10" fill="#f57c00" opacity="0.25"/>
    <text x="160" y="24" text-anchor="middle" fill="#ffb74d" font-size="14" font-weight="bold">2. PYTHON BACKEND &amp; ETL ENGINE</text>

    <!-- Box 1: API Extractor -->
    <rect x="15" y="55" width="290" height="85" rx="8" fill="#1e1e1e" stroke="#f57c00" stroke-width="1"/>
    <text x="25" y="78" fill="#ffb74d" font-size="13" font-weight="bold">API Extractor (Xử lý kết nối)</text>
    <text x="25" y="98" fill="#cccccc" font-size="11">• Bearer Token Auth &amp; Rate Limit</text>
    <text x="25" y="116" fill="#cccccc" font-size="11">• Phân trang tự động (Auto-Pagination)</text>
    <text x="25" y="132" fill="#ffe0b2" font-size="11">• Đồng bộ JSON đa tầng Jobs/Issues</text>

    <!-- Box 2: Processor -->
    <rect x="15" y="150" width="290" height="110" rx="8" fill="#1e1e1e" stroke="#f57c00" stroke-width="1"/>
    <text x="25" y="173" fill="#ffb74d" font-size="13" font-weight="bold">Data Processor &amp; Aggregator</text>
    <text x="25" y="193" fill="#cccccc" font-size="11">• Gom tiến độ theo Batch &amp; Annotator</text>
    <text x="25" y="211" fill="#cccccc" font-size="11">• Tính điểm QA Score &amp; Vận tốc (f/h)</text>
    <text x="25" y="229" fill="#cccccc" font-size="11">• Phân loại ma trận 4 nhóm lỗi</text>
    <text x="25" y="247" fill="#ffe0b2" font-size="11">• Sinh URL Deep Link tới từng frame</text>

    <!-- Box 3: Jinja2 Reporter -->
    <rect x="15" y="270" width="290" height="85" rx="8" fill="#1e1e1e" stroke="#f57c00" stroke-width="1"/>
    <text x="25" y="293" fill="#ffb74d" font-size="13" font-weight="bold">Jinja2 Template &amp; LLM Reporter</text>
    <text x="25" y="313" fill="#cccccc" font-size="11">• Soạn bản nháp MENTOR_REPORT_DRAFT.md</text>
    <text x="25" y="331" fill="#cccccc" font-size="11">• Khung chuẩn 4 phần gửi Mentor trước họp</text>
    <text x="25" y="347" fill="#ffe0b2" font-size="11">• LLM tóm lược Executive Summary</text>

    <!-- Box 4: Power BI CSV Exporter -->
    <rect x="15" y="365" width="290" height="90" rx="8" fill="#1e1e1e" stroke="#fbc02d" stroke-width="1.2"/>
    <text x="25" y="388" fill="#fff176" font-size="13" font-weight="bold">Power BI Exporter (Data Layer)</text>
    <text x="25" y="408" fill="#cccccc" font-size="11">• Xuất data/processed/batch_progress.csv</text>
    <text x="25" y="426" fill="#cccccc" font-size="11">• Xuất data/processed/qa_metrics.csv</text>
    <text x="25" y="444" fill="#fff59d" font-size="11">• Xuất data/processed/edge_cases.csv</text>
  </g>

  <!-- Column 3: Power BI Presentation -->
  <g transform="translate(730, 105)" filter="url(#shadow)">
    <rect width="320" height="470" rx="10" fill="#252526" stroke="#fbc02d" stroke-width="1.5"/>
    <rect width="320" height="38" rx="10" fill="#fbc02d" opacity="0.25"/>
    <text x="160" y="24" text-anchor="middle" fill="#fff176" font-size="14" font-weight="bold">3. POWER BI DASHBOARD (ANALYTICS)</text>

    <!-- Page 1 -->
    <rect x="15" y="55" width="290" height="120" rx="8" fill="#1e1e1e" stroke="#fbc02d" stroke-width="1"/>
    <text x="25" y="78" fill="#fff176" font-size="13" font-weight="bold">📊 Page 1: Tiến Độ Theo Batch</text>
    <text x="25" y="100" fill="#cccccc" font-size="11">• KPI Cards: Tổng Frame, % Hoàn thành</text>
    <text x="25" y="118" fill="#cccccc" font-size="11">• Stacked Bar: Done vs Review vs In-progress</text>
    <text x="25" y="136" fill="#cccccc" font-size="11">• Velocity Timeline: Vận tốc gán nhãn</text>
    <text x="25" y="156" fill="#ffe082" font-size="11">👉 Slicer lọc động theo Batch &amp; Ngày</text>

    <!-- Page 2 -->
    <rect x="15" y="185" width="290" height="125" rx="8" fill="#1e1e1e" stroke="#fbc02d" stroke-width="1"/>
    <text x="25" y="208" fill="#fff176" font-size="13" font-weight="bold">🎯 Page 2: Điểm QA &amp; Ma Trận Lỗi</text>
    <text x="25" y="230" fill="#cccccc" font-size="11">• Leaderboard: Xếp hạng điểm thành viên</text>
    <text x="25" y="248" fill="#cccccc" font-size="11">• Donut Chart: Ma trận 4 nhóm lỗi phổ biến</text>
    <text x="25" y="266" fill="#cccccc" font-size="11">• Scatter Plot: Tương quan Vận tốc vs Điểm QA</text>
    <text x="25" y="288" fill="#ffe082" font-size="11">👉 Phát hiện lệch viền box &amp; nhầm class</text>

    <!-- Page 3 -->
    <rect x="15" y="320" width="290" height="135" rx="8" fill="#1e1e1e" stroke="#fbc02d" stroke-width="1"/>
    <text x="25" y="343" fill="#fff176" font-size="13" font-weight="bold">🔍 Page 3: Danh Mục Ca Khó (Action Board)</text>
    <text x="25" y="365" fill="#cccccc" font-size="11">• Table Visual: Xếp hạng Blocker / Major / Minor</text>
    <text x="25" y="383" fill="#cccccc" font-size="11">• Cột URL định dạng Web URL:</text>
    <text x="25" y="401" fill="#4fc3f7" font-size="11">  🔗 Click mở trực tiếp Frame trên CVAT</text>
    <text x="25" y="421" fill="#cccccc" font-size="11">• Thẻ hiển thị câu hỏi chi tiết của annotator</text>
    <text x="25" y="441" fill="#ffe082" font-size="11">👉 Mentor thẩm định trực quan ngay tại họp</text>
  </g>

  <!-- Column 4: Delivery & Mentor Session -->
  <g transform="translate(1110, 105)" filter="url(#shadow)">
    <rect width="250" height="470" rx="10" fill="#252526" stroke="#388e3c" stroke-width="1.5"/>
    <rect width="250" height="38" rx="10" fill="#388e3c" opacity="0.25"/>
    <text x="125" y="24" text-anchor="middle" fill="#81c784" font-size="14" font-weight="bold">4. ĐẦU RA PHIÊN MENTOR</text>

    <!-- Box Document -->
    <rect x="15" y="55" width="220" height="130" rx="8" fill="#1e1e1e" stroke="#388e3c" stroke-width="1"/>
    <text x="25" y="80" fill="#81c784" font-size="13" font-weight="bold">Văn Bản Báo Cáo Pre-Mentor</text>
    <text x="25" y="103" fill="#cccccc" font-size="11">• MENTOR_REPORT_DRAFT.md</text>
    <text x="25" y="121" fill="#cccccc" font-size="11">• Xuất PDF / HTML tóm tắt</text>
    <text x="25" y="139" fill="#cccccc" font-size="11">• Gửi Leader duyệt trong 5 phút</text>
    <text x="25" y="161" fill="#c8e6c9" font-size="11">👉 Gửi trước 24h cho Mentor</text>

    <!-- Box Interactive Viz -->
    <rect x="15" y="195" width="220" height="130" rx="8" fill="#1e1e1e" stroke="#388e3c" stroke-width="1"/>
    <text x="25" y="220" fill="#81c784" font-size="13" font-weight="bold">Trình Chiếu Power BI Live</text>
    <text x="25" y="243" fill="#cccccc" font-size="11">• Trình diễn số liệu vĩ mô</text>
    <text x="25" y="261" fill="#cccccc" font-size="11">• Drill-down sâu khi Mentor hỏi</text>
    <text x="25" y="279" fill="#cccccc" font-size="11">• Tương tác trực tiếp trên meeting</text>
    <text x="25" y="301" fill="#c8e6c9" font-size="11">👉 Chuyên nghiệp chuẩn Enterprise</text>

    <!-- Box Alerts -->
    <rect x="15" y="335" width="220" height="120" rx="8" fill="#1e1e1e" stroke="#388e3c" stroke-width="1"/>
    <text x="25" y="360" fill="#81c784" font-size="13" font-weight="bold">Thông Báo Đa Kênh Tức Thời</text>
    <text x="25" y="383" fill="#cccccc" font-size="11">• 📱 Telegram Bot ping nhóm</text>
    <text x="25" y="401" fill="#cccccc" font-size="11">• 💬 Discord Webhook card</text>
    <text x="25" y="419" fill="#cccccc" font-size="11">• 🐙 GitHub PR mở tự động</text>
    <text x="25" y="440" fill="#c8e6c9" font-size="11">👉 Không lo sót lịch họp</text>
  </g>

  <!-- Connectors -->
  <!-- Col 1 to Col 2 -->
  <line x1="290" y1="200" x2="345" y2="200" stroke="#4fc3f7" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="290" y1="350" x2="345" y2="350" stroke="#4fc3f7" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Col 2 to Col 3 (CSV export) -->
  <path d="M 670 410 L 700 410 L 700 340 L 725 340" fill="none" stroke="#fbc02d" stroke-width="2.2" marker-end="url(#arrow-gold)"/>
  <rect x="655" y="360" width="80" height="22" rx="4" fill="#1e1e1e" stroke="#fbc02d" stroke-width="1"/>
  <text x="695" y="375" text-anchor="middle" fill="#fff176" font-size="10" font-weight="bold">Auto CSV</text>

  <!-- Col 2 to Col 4 (Draft report) -->
  <path d="M 670 310 L 700 310 L 700 80 L 1080 80 L 1080 120 L 1105 120" fill="none" stroke="#81c784" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow-green)"/>

  <!-- Col 3 to Col 4 (Live viz) -->
  <line x1="1050" y1="260" x2="1105" y2="260" stroke="#81c784" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Bottom Summary Card: Value Proposition -->
  <g transform="translate(40, 605)" filter="url(#shadow)">
    <rect width="1320" height="175" rx="10" fill="#252526" stroke="#ab47bc" stroke-width="1.5"/>
    <rect width="1320" height="34" rx="10" fill="#ab47bc" opacity="0.25"/>
    <text x="660" y="22" text-anchor="middle" fill="#e1bee7" font-size="14" font-weight="bold">GIÁ TRỊ CỐT LÕI CỦA SỰ KẾT HỢP HYBRID (PYTHON + POWER BI)</text>

    <g transform="translate(30, 45)">
      <rect width="390" height="110" rx="8" fill="#1e1e1e" stroke="#ba68c8" stroke-width="1"/>
      <text x="15" y="26" fill="#e1bee7" font-size="13" font-weight="bold">⚡ Giải Quyết Điểm Nghẽn API &amp; Auth</text>
      <text x="15" y="50" fill="#cccccc" font-size="11">• CVAT API yêu cầu Token Header và phân trang sâu phức tạp.</text>
      <text x="15" y="70" fill="#cccccc" font-size="11">• Python đảm nhiệm toàn bộ khâu kết nối, biến đổi JSON thô</text>
      <text x="15" y="90" fill="#ce93d8" font-size="11">  thành tập dữ liệu sạch, Power BI chỉ việc đọc và hiển thị.</text>
    </g>

    <g transform="translate(465, 45)">
      <rect width="390" height="110" rx="8" fill="#1e1e1e" stroke="#ba68c8" stroke-width="1"/>
      <text x="15" y="26" fill="#e1bee7" font-size="13" font-weight="bold">📊 Trực Quan Hóa Cấp Doanh Nghiệp</text>
      <text x="15" y="50" fill="#cccccc" font-size="11">• Tận dụng tối đa hệ sinh thái trực quan hóa mạnh mẽ của Power BI.</text>
      <text x="15" y="70" fill="#cccccc" font-size="11">• Nhóm trưởng &amp; Mentor có thể click tương tác, lọc theo annotator,</text>
      <text x="15" y="90" fill="#ce93d8" font-size="11">  xem biểu đồ tương quan vận tốc và lỗi chỉ bằng 1 cú nhấp chuột.</text>
    </g>

    <g transform="translate(900, 45)">
      <rect width="390" height="110" rx="8" fill="#1e1e1e" stroke="#ba68c8" stroke-width="1"/>
      <text x="15" y="26" fill="#e1bee7" font-size="13" font-weight="bold">📝 Vẫn Đảm Bảo Báo Cáo Văn Bản Khép Kín</text>
      <text x="15" y="50" fill="#cccccc" font-size="11">• Song song với BI, Python vẫn tự động soạn MENTOR_REPORT_DRAFT.md.</text>
      <text x="15" y="70" fill="#cccccc" font-size="11">• Có đầy đủ danh mục câu hỏi và checklist để Mentor trả lời trước,</text>
      <text x="15" y="90" fill="#ce93d8" font-size="11">  sau đó đồng bộ ngược lại quy chuẩn trên GitHub!</text>
    </g>
  </g>
</svg>
